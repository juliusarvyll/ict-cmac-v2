services:
  db:
    image: postgres:17
    container_name: ict-cmac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: ict_cmac
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ict-cmac-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ict_cmac"]
      interval: 5s
      timeout: 5s
      retries: 20

  clamav:
    image: clamav/clamav:1.4
    container_name: ict-cmac-clamav
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - ict-cmac-clamav-data:/var/lib/clamav

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ict-cmac-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ict-cmac-pmac-uploads:/app/private/uploads/pmac
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-local-development-only}@db:5432/ict_cmac
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD:-local-development-only}@db:5432/ict_cmac
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_TIMEOUT_MS: 30000
      SERVER_ACTION_ALLOWED_ORIGINS: ${SERVER_ACTION_ALLOWED_ORIGINS:-}
      PRISMA_RUN_MIGRATIONS: ${PRISMA_RUN_MIGRATIONS:-0}
      PRISMA_RUN_SEED: ${PRISMA_RUN_SEED:-0}

volumes:
  # A new volume; the old MySQL volume must be retained until migration is verified.
  ict-cmac-postgres-data:
  ict-cmac-clamav-data:
  ict-cmac-pmac-uploads:
