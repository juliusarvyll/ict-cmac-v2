name: Application Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  mysql-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-ephemeral
          MYSQL_DATABASE: pmac_concurrency
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # Throwaway service credentials, never application or production secrets.
      DATABASE_URL: mysql://root:ci-only-ephemeral@127.0.0.1:3306/pmac_concurrency
      PMAC_CONCURRENCY_TESTS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Schema provisioning is permitted only for this job's disposable service.
      - run: npx prisma db push --skip-generate
      - run: npm run test:concurrency
